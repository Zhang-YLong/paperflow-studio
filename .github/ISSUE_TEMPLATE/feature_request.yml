name: 功能建议
description: 描述希望纸舟解决的真实工作场景
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你正在解决什么问题？
      description: 请描述现在的工作流程、频率和痛点。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 理想结果
      description: 如果功能实现，成功的体验是什么样？
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 使用频率
      options:
        - 每天
        - 每周
        - 每月
        - 偶尔
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
