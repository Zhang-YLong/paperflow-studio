<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <clipPath id="screen">
      <rect x="650" y="80" width="760" height="480" rx="10" />
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#171914" />
  <circle cx="116" cy="104" r="30" fill="#e9ff65" />
  <path d="M92 104c19-20 37-21 50-13-11 8-26 13-50 13Zm3 10c18-7 32-7 43-2-10 12-24 18-43 18Z" fill="#171914" />

  <text x="164" y="98" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" font-weight="700" letter-spacing="4">纸舟</text>
  <text x="164" y="123" fill="#85887e" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="2.8">PAPERFLOW STUDIO</text>

  <text x="78" y="224" fill="#e9ff65" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="3">LOCAL-FIRST DOCUMENT AUTOMATION</text>
  <text x="78" y="305" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="58" font-weight="500">把重复文档，</text>
  <text x="78" y="380" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="58" font-weight="500">变成一次设计。</text>

  <text x="82" y="438" fill="#b8bbb1" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19">设计模板 · 导入 CSV · 批量生成中文 PDF</text>

  <g transform="translate(78 478)">
    <rect width="118" height="34" rx="17" fill="#252820" stroke="#474a41" />
    <text x="59" y="22" text-anchor="middle" fill="#d7d9d1" font-family="Microsoft YaHei, sans-serif" font-size="12">无需登录</text>
    <rect x="128" width="128" height="34" rx="17" fill="#252820" stroke="#474a41" />
    <text x="192" y="22" text-anchor="middle" fill="#d7d9d1" font-family="Microsoft YaHei, sans-serif" font-size="12">不上传数据</text>
    <rect x="266" width="154" height="34" rx="17" fill="#e9ff65" />
    <text x="343" y="22" text-anchor="middle" fill="#171914" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="700">开源 · Public Beta</text>
  </g>

  <text x="80" y="580" fill="#6f7268" font-family="Segoe UI, sans-serif" font-size="12" letter-spacing="1.2">github.com/Zhang-YLong/paperflow-studio</text>

  <g transform="rotate(-2 1000 320)" filter="url(#shadow)">
    <rect x="630" y="58" width="770" height="504" rx="14" fill="#f3f0e8" stroke="#e9ff65" stroke-width="2" />
    <image href="home.png" x="650" y="80" width="760" height="528" preserveAspectRatio="xMidYMin slice" clip-path="url(#screen)" />
  </g>

  <path d="M1190 40h50v50" fill="none" stroke="#e9ff65" stroke-width="2" />
  <path d="M40 550v50h50" fill="none" stroke="#34372f" stroke-width="2" />
</svg>
